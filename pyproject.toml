[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diagforge"
version = "0.1.0"
description = "Deterministic multi-file compiler diagnostic sample minimizer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["diagforge*"]

[tool.setuptools.package-data]
diagforge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
